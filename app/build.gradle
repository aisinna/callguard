plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---- 릴리스 서명 설정 -------------------------------------------------------
// 키스토어와 비밀번호는 절대 저장소에 넣지 않는다.
// GitHub Actions 가 시크릿을 환경변수로 넘기고, 워크플로가 키스토어를 app/release.keystore 로 복원한다.
//   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD  (KEYSTORE_BASE64 는 워크플로가 파일로 변환)
// 하나라도 없으면 서명 없이 빌드된다(디버그 빌드·포크 PR 은 영향 없음).
// 로컬에서 릴리스를 서명하려면 같은 이름의 환경변수를 설정하고 app/release.keystore 를 두면 된다.
def releaseKeystore = file("release.keystore")
def hasReleaseSigning = releaseKeystore.exists() &&
        System.getenv("KEYSTORE_PASSWORD") &&
        System.getenv("KEY_ALIAS") &&
        System.getenv("KEY_PASSWORD")

android {
    namespace 'com.parentcare.callguard'
    // TODO(스토어 제출 전 필수, 2026-09-29 기준): 구글 플레이는 신규 앱 제출에 targetSdk 36(Android 16)을
    // 요구한다. compileSdk 36 은 AGP 9.0+ 가 필요하고, AGP 9.0 은 지금 쓰는 별도 Kotlin 플러그인
    // (org.jetbrains.kotlin.android) 과 호환되지 않는 새 DSL 을 쓴다 — 버전 숫자만 올리는 문제가 아니다.
    // 이 환경(Gradle/AGP 를 실제로 돌려볼 수 없음)에서는 이 마이그레이션을 검증할 수 없어 손대지 않았다.
    // Android Studio 의 "AGP Upgrade Assistant"로 진행할 것. DEVELOPMENT.md 참고.
    compileSdk 34

    defaultConfig {
        applicationId "com.parentcare.callguard"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.5"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystore
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
