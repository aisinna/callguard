name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '릴리스 만들기: 버전 태그 입력 (예: v1.0). 비워두면 빌드만 하고 릴리스는 만들지 않습니다'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 릴리스 초안 생성용 (그 외 권한은 주지 않음)

    env:
      # 수동 실행 입력값 또는 v* 태그 푸시에서 릴리스 태그를 결정. 둘 다 아니면 빈 값(=릴리스 안 만듦)
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GRADLE_VERSION: '8.7'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ★ 핵심 수정: setup-gradle 액션 제거, 직접 다운로드
      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          set -e
          echo "Downloading Gradle ${GRADLE_VERSION} ..."
          curl -sSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q -d /opt/gradle /tmp/gradle.zip
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Check release request
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          echo "릴리스 태그: $RELEASE_TAG"

          # 1) 태그 형식 (v1.0, v1.0.1 ...)
          if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then
            echo "::error::태그 형식이 올바르지 않습니다: '$RELEASE_TAG' (예: v1.0 또는 v1.0.1)"
            exit 1
          fi

          # 2) 서명 키가 있어야 릴리스를 만들 수 있음 (서명 안 된 APK 를 배포하면 안 됨)
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::서명 키(GitHub Secrets)가 없어 릴리스를 만들 수 없습니다."
            exit 1
          fi

          # 3) 태그 버전과 앱 versionName 이 같아야 함 (버전이 다른 APK 가 배포되는 실수 방지)
          TAG_VERSION="${RELEASE_TAG#v}"
          APP_VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' app/build.gradle | head -n 1)
          echo "태그 버전: $TAG_VERSION / 앱 versionName: $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::태그(v$TAG_VERSION)와 app/build.gradle 의 versionName($APP_VERSION)이 다릅니다. 같은 값으로 맞춘 뒤 다시 실행하세요."
            exit 1
          fi

          # 4) 같은 태그의 릴리스(초안 포함)가 이미 있으면 중단
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "$RELEASE_TAG"; then
            echo "::error::'$RELEASE_TAG' 릴리스(초안 포함)가 이미 있습니다. Releases 에서 삭제하거나 새 버전 번호를 쓰세요."
            exit 1
          fi
          echo "릴리스 요청 검증 통과"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: List outputs
        if: always()
        run: |
          echo "=== APK 검색 결과 ==="
          find . -name "*.apk" -type f || echo "APK 파일을 찾지 못했습니다"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Check signing secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          missing=0
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub Secret '$v' 이(가) 비어 있습니다. 서명된 릴리스를 만들 수 없습니다."
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build release APK (signed)
        if: env.KEYSTORE_BASE64 != ''
        run: gradle assembleRelease --no-daemon --no-build-cache --stacktrace

      - name: Verify release signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          case "$APK" in
            *unsigned*)
              echo "::error::서명되지 않은 APK 가 만들어졌습니다 (app/build.gradle 의 signingConfig 확인)"
              exit 1 ;;
          esac

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner 를 찾지 못해 서명 검증을 건너뜁니다"
          else
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          fi

          {
            echo "### 릴리스 APK 체크섬 (SHA-256)"
            echo '```'
            sha256sum "$APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: callguard-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create draft GitHub release
        if: env.RELEASE_TAG != '' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p release
          cp "$APK_SRC" release/app-release.apk
          (cd release && sha256sum app-release.apk > app-release.apk.sha256)
          SHA=$(cut -d' ' -f1 release/app-release.apk.sha256)
          VERSION="${RELEASE_TAG#v}"

          {
            echo "## 서로지킴 ${VERSION}"
            echo
            echo "### 설치 전에 꼭 읽어주세요"
            echo "- 이 앱은 보이스피싱을 막아주는 앱이 아니라 **위험 신호를 알려주는 보조 도구**입니다."
            echo "- **이 저장소의 Releases 에서만** 받으세요. 전화·문자로 받은 링크의 APK 는 설치하지 마세요."
            echo "- 설치 방법과 예상되는 경고 화면: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#설치-방법"
            echo "- 알려진 한계: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#알려진-한계"
            echo
            echo "### 파일 확인 (SHA-256)"
            echo '```'
            echo "${SHA}  app-release.apk"
            echo '```'
            echo "- Windows: \`certutil -hashfile app-release.apk SHA256\`"
            echo "- Mac / Linux: \`shasum -a 256 app-release.apk\`"
            echo
            echo "### 변경 내용"
            echo "(여기에 이번 버전에서 바뀐 점을 적어주세요)"
          } > release/notes.md

          gh release create "$RELEASE_TAG" \
            release/app-release.apk \
            release/app-release.apk.sha256 \
            --draft \
            --target "$GITHUB_SHA" \
            --title "서로지킴 ${VERSION}" \
            --notes-file release/notes.md

          {
            echo "### 릴리스 초안이 만들어졌습니다"
            echo "- 태그: \`${RELEASE_TAG}\`"
            echo "- Releases 페이지에서 내용을 확인하고 **Publish release** 를 눌러야 공개됩니다."
          } >> "$GITHUB_STEP_SUMMARY"
