name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # GitHub 웹페이지에서 수동으로 "Run workflow" 버튼 클릭 가능

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets 는 step 의 if 조건에서 직접 쓸 수 없으므로
    # job 레벨 env 에 한 번 담아두고, if 에서는 env 를 참조한다.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      # 1. 소스코드 내려받기
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. JDK 17 설치 (Android Gradle Plugin 8.x 는 JDK 17 필요)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK 설치
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Gradle 설치 (gradle-wrapper.jar 없이 빌드하기 위함)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 5. 디버그 APK 빌드 (자동 서명되어 바로 설치 가능)
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # 6. 빌드된 APK 를 Artifacts 로 업로드 -> 여기서 다운로드
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ----- 아래는 선택 사항 -----
      # 키스토어를 Secrets 에 등록한 경우에만 자동 실행되고,
      # 등록하지 않았다면 전부 건너뜁니다.

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build release APK (signed)
        if: env.KEYSTORE_BASE64 != ''
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: callguard-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
