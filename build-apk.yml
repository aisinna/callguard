name: Build APK

# 언제 실행할지
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # GitHub 웹페이지에서 수동으로 "Run workflow" 버튼 클릭 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 내려받기
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. JDK 17 설치 (Android Gradle Plugin 8.x는 JDK 17 필요)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK 설치
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Gradle 설치 (gradle-wrapper.jar 없이 빌드하기 위함)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 5. 디버그 APK 빌드 (자동 서명되어 바로 설치 가능)
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # 6. 빌드된 APK를 Artifacts로 업로드 -> 여기서 다운로드
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callguard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 7. (선택) 릴리즈용 서명 APK - 키스토어를 Secrets에 등록한 경우에만 동작
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK (signed)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: callguard-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
